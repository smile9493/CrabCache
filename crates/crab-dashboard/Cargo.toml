[package]
name = "crab-dashboard"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[dependencies]
leptos = { version = "0.7", features = ["csr"] }
leptos_router = "0.7"
leptos_meta = "0.7"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Window", "Location", "Document", "HtmlDocument", "Element", "HtmlElement", "HtmlDivElement", "HtmlTextAreaElement", "console", "Navigator", "Clipboard", "Storage", "KeyboardEvent", "CssStyleDeclaration", "MouseEvent", "SvgsvgElement", "SvgGraphicsElement", "SvgMatrix", "EventSource", "MessageEvent", "Event"] }
crab-admin-types.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
gloo-net = { version = "0.6", features = ["http"] }
gloo-timers = { version = "0.3", features = ["futures"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "now"] }
futures = "0.3"
js-sys = "0.3"
console_error_panic_hook = "0.1"
urlencoding = "2"