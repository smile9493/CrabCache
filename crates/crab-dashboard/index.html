<!DOCTYPE html>
<html lang="en" class="antialiased theme-dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <script>
    (function () {
        var themes = { dark: 'theme-dark', light: 'theme-light', midnight: 'theme-midnight', ocean: 'theme-ocean', sand: 'theme-sand' };
        var bootColors = {
            'theme-dark':     { bg: '#0d1117', text: '#e6edf3', accent: '#f78166', spinner: 'rgba(255,255,255,0.15)' },
            'theme-light':    { bg: '#f6f4f0', text: '#1a1814', accent: '#c44d2f', spinner: 'rgba(0,0,0,0.10)' },
            'theme-midnight': { bg: '#0c0a14', text: '#ece8f5', accent: '#c4a1ff', spinner: 'rgba(255,255,255,0.12)' },
            'theme-ocean':    { bg: '#0a1218', text: '#e2edf4', accent: '#3db8c9', spinner: 'rgba(255,255,255,0.12)' },
            'theme-sand':     { bg: '#f4f0e8', text: '#2a261f', accent: '#b85c28', spinner: 'rgba(0,0,0,0.08)' }
        };
        var stored = 'dark';
        try { stored = localStorage.getItem('theme') || 'dark'; } catch (e) {}
        var resolved = stored;
        if (stored === 'system') {
            resolved = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        var cls = themes[resolved] || 'theme-dark';
        document.documentElement.className = 'antialiased ' + cls;
        var c = bootColors[cls] || bootColors['theme-dark'];
        document.documentElement.style.setProperty('--boot-bg', c.bg);
        document.documentElement.style.setProperty('--boot-text', c.text);
        document.documentElement.style.setProperty('--boot-accent', c.accent);
        document.documentElement.style.setProperty('--boot-spinner', c.spinner);
    })();
    </script>
    <title>CrabCache &mdash; Gateway Control</title>
    <link data-trunk rel="css" href="/style/output.css" />
    <link data-trunk rel="copy-file" href="style/brand.png" />
    <link data-trunk rel="icon" type="image/png" href="/style/brand.png" />
    <style>
      #boot-shell {
        min-height: 100vh;
        margin: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--boot-bg, #0d1117);
        color: var(--boot-text, #e6edf3);
        font-family: ui-sans-serif, system-ui, sans-serif;
        transition: background 0.2s, color 0.2s;
      }
      #boot-shell .boot-card {
        text-align: center;
        padding: 2rem;
        max-width: 420px;
      }
      #boot-shell .boot-title { font-size: 1.25rem; font-weight: 700; margin: 0.5rem 0 0; }
      #boot-shell .boot-tagline { font-size: 0.75rem; opacity: 0.65; margin: 0.25rem 0 0; }
      #boot-shell .boot-spinner {
        width: 2rem;
        height: 2rem;
        margin: 1.25rem auto 0;
        border: 2px solid var(--boot-spinner, rgba(255,255,255,0.15));
        border-top-color: var(--boot-accent, #f78166);
        border-radius: 50%;
        animation: boot-spin 0.7s linear infinite;
      }
      #boot-shell-status { font-size: 0.875rem; margin-top: 1rem; min-height: 1.25rem; opacity: 0.75; }
      #boot-shell-status.boot-error { color: #e57373; opacity: 1; }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
    </style>
    <script>
    (function () {
        function showBootError(msg) {
            var status = document.getElementById('boot-shell-status');
            if (status) {
                status.textContent = msg;
                status.classList.add('boot-error');
            }
        }
        function removeBootShell() {
            var attempts = 0;
            function tick() {
                var app = document.getElementById('app');
                if (app && app.childElementCount > 0) {
                    var shell = document.getElementById('boot-shell');
                    if (shell) shell.remove();
                    return;
                }
                if (++attempts < 600) {
                    requestAnimationFrame(tick);
                }
            }
            tick();
        }
        window.addEventListener('TrunkApplicationStarted', removeBootShell);
        window.addEventListener('error', function (e) {
            var t = e.target;
            if (t && (t.tagName === 'SCRIPT' || t.tagName === 'LINK')) {
                showBootError('Failed to load dashboard assets. Hard-refresh (Ctrl+Shift+R) or check the network tab.');
            }
        }, true);
        window.addEventListener('unhandledrejection', function (e) {
            var msg = e.reason && (e.reason.message || String(e.reason));
            if (msg) showBootError('Dashboard failed to start: ' + msg);
        });
        window.setTimeout(function () {
            var app = document.getElementById('app');
            var shell = document.getElementById('boot-shell');
            if (!shell || !app || app.childElementCount > 0) return;
            showBootError('Failed to load dashboard. Refresh the page or check the browser console.');
        }, 60000);
    })();
    </script>
</head>
<body>
    <div id="boot-shell" aria-busy="true" aria-label="Loading">
        <div class="boot-card">
            <div class="boot-title">CrabCache</div>
            <div class="boot-tagline">Gateway Control</div>
            <div class="boot-spinner" role="status" aria-hidden="true"></div>
            <p id="boot-shell-status"></p>
        </div>
    </div>
    <div id="app"></div>
</body>
</html>
