[package]
name = "crab-gateway"
version.workspace = true
edition.workspace = true

[lib]
name = "crab_gateway"
path = "src/lib.rs"

[[bin]]
name = "crab-gateway"
path = "src/main.rs"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
axum = "0.8"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[dependencies]
crab-proxy.workspace = true
crab-metrics.workspace = true
crab-cache.workspace = true
crab-route.workspace = true
crab-semantic.workspace = true
crab-reasoning.workspace = true
crab-control.workspace = true
axum = "0.8"
uuid.workspace = true
pingora.workspace = true
pingora-core.workspace = true
pingora-proxy.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
tokio.workspace = true
prometheus.workspace = true
bb8.workspace = true
bb8-redis.workspace = true
async-trait.workspace = true
dashmap.workspace = true

[target.'cfg(not(target_env = "msvc"))'.dependencies]
jemallocator = { version = "0.5", features = ["profiling", "unprefixed_malloc_on_supported_platforms"] }
