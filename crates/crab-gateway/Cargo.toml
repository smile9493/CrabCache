[package]
name = "crab-gateway"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "crab_gateway"
path = "src/lib.rs"

[features]
fault-injection = ["crab-proxy/fault-injection"]

[[bin]]
name = "crab-gateway"
path = "src/main.rs"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
axum = "0.7"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
bb8.workspace = true
bb8-redis.workspace = true
crab-state.workspace = true
crab-client-endpoint.workspace = true
uuid.workspace = true
bytes.workspace = true

[lints]
workspace = true

