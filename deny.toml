[bans]
# Multiple versions of the same crate can cause bloat and confusion.
# deny = ["duplicates"] would fail on any duplicates.
multiple-versions = "warn"
# Wildcard dependencies are not allowed
wildcards = "warn"
# Highlighted crates to deny explicitly
deny = []
# Skip these crates even if they appear multiple times
skip = [
    # reqwest pulls in multiple versions of some deps
    { name = "hyper", version = "0.14" },
    { name = "http", version = "0.2" },
]
skip-tree = [
    # tokio-util / tokio-stream may pull alternative versions of tokio
    { name = "tokio-util" },
    { name = "tokio-stream" },
]

[sources]
# Restrict allowed source locations
allow-git = []
# Deny all unknown registries
unknown-registry = "deny"
unknown-git = "deny"
