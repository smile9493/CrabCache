expression = "MIT OR Apache-2.0"
license-files = []

[[licenses.clarify]]
name = "crab-pipeline"
expression = "MIT OR Apache-2.0"
license-files = []

[[licenses.clarify]]
name = "crab-proxy"
expression = "MIT OR Apache-2.0"
license-files = []

[[licenses.clarify]]
name = "crab-reasoning"
expression = "MIT OR Apache-2.0"
