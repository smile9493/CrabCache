# cargo-deny configuration for CrabCache
# https://embarkstudios.github.io/cargo-deny/

[advisories]
version = 2
unmaintained = "workspace"
yanked = "warn"
ignore = [
    "RUSTSEC-2025-0134",  # rustls-pemfile unmaintained (transitive dep, no safe upgrade)
    "RUSTSEC-2024-0437",  # protobuf: uncontrolled recursion (transitive dep via pingora)
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "0BSD",
    "OpenSSL",
    "MPL-2.0",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
