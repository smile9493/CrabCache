version: "3.8"

services:
  gateway:
    build: .
    ports:
      - "8080:8080"
      - "9090:9090"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8080/ready"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    volumes:
      - ./config/gateway.toml:/app/config/gateway.toml:ro
      - ./models:/app/models:ro
    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    environment:
      - RUST_LOG=info
      - CRABCACHE_GATEWAY_ADMIN_KEY=${CRABCACHE_GATEWAY_ADMIN_KEY:-dev-only-gateway-admin-secret}
      - CRABCACHE_MANAGEMENT_LISTEN=0.0.0.0:9080
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334

volumes:
  redis_data:
  qdrant_data:
