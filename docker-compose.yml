# CrabCache gateway stack (new-api style: gateway + Redis, env-driven upstream).
#
# Quick start:
#   cp .env.example .env
#   # set CRABCACHE_API_KEY, CRABCACHE_GATEWAY_ADMIN_KEY
#   docker compose up -d
#
# Optional admin dashboard:
#   docker compose --profile admin up -d
#
# Optional semantic cache (Qdrant):
#   docker compose --profile semantic up -d
#
# Optional: attach to an external reverse-proxy network (e.g. OpenResty):
#   docker compose -f docker-compose.yml -f docker-compose.openresty.yml up -d

services:
  gateway:
    build: .
    container_name: crabcache-gateway
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:9080:9080"
      - "127.0.0.1:9090:9090"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8080/ready"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    volumes:
      - ./config/gateway.docker.toml:/app/config/gateway.toml:ro
      - gateway_data:/app/data
      - gateway_logs:/app/logs
      # Optional debug NDJSON (uncomment while diagnosing):
      - ./.cursor:/app/.cursor
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - RUST_LOG=${RUST_LOG:-info}
      - CRABCACHE_API_KEY=${CRABCACHE_API_KEY:?Set CRABCACHE_API_KEY in .env}
      - CRABCACHE_UPSTREAM_KEYS=${CRABCACHE_UPSTREAM_KEYS:-}
      - CRABCACHE_UPSTREAM_BASE_URL=${CRABCACHE_UPSTREAM_BASE_URL:-}
      - CRABCACHE_UPSTREAM_MODEL=${CRABCACHE_UPSTREAM_MODEL:-}
      - CRABCACHE_GATEWAY_ADMIN_KEY=${CRABCACHE_GATEWAY_ADMIN_KEY:-change-me-in-production}
      - CRABCACHE_L1_REDIS_URL=${CRABCACHE_L1_REDIS_URL:-redis://redis:6379}
      - CRABCACHE_MANAGEMENT_LISTEN=0.0.0.0:9080
      - CRABCACHE_BOOTSTRAP_CLIENT_KEYS=${CRABCACHE_BOOTSTRAP_CLIENT_KEYS:-}
      - CRABCACHE_DEBUG_LOG_PATH=/app/.cursor/debug-3f9816.log
      - CRABCACHE_DEBUG_RUN_ID=cursor-debug
    restart: unless-stopped

  admin:
    profiles:
      - admin
    build:
      context: .
      dockerfile: Dockerfile.admin
    container_name: crabcache-admin
    ports:
      - "127.0.0.1:18001:3000"
    volumes:
      - gateway_logs:/app/logs:ro
      # 1Panel OpenResty site configs (read-only) for Keys page base URL auto-detect
      - /opt/1panel/www/conf.d:/host/openresty/conf.d:ro
    environment:
      - RUST_LOG=info
      - CRABCACHE_GATEWAY_CONTROL_URL=http://gateway:9080
      - CRABCACHE_GATEWAY_METRICS_URL=http://gateway:9090/metrics
      - CRABCACHE_GATEWAY_ADMIN_KEY=${CRABCACHE_GATEWAY_ADMIN_KEY:-change-me-in-production}
      # Keys page LAN URL: set to host LAN IP (container auto-detect is unreliable)
      - CRABCACHE_GATEWAY_CLIENT_LAN_HOST=${CRABCACHE_GATEWAY_CLIENT_LAN_HOST:-}
      - CRABCACHE_OPENRESTY_CONF_DIR=/host/openresty/conf.d
      # Optional override: CRABCACHE_GATEWAY_OPENRESTY_BASE_URL=https://domain:18000
      - CRABCACHE_ADMIN_KEY=${CRABCACHE_ADMIN_KEY:-admin}
      - CRABCACHE_UPSTREAM_KEYS=${CRABCACHE_UPSTREAM_KEYS:-}
      - CRABCACHE_API_KEY=${CRABCACHE_API_KEY:-}
    depends_on:
      gateway:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: crabcache-redis
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  qdrant:
    profiles:
      - semantic
    image: qdrant/qdrant:latest
    container_name: crabcache-qdrant
    expose:
      - "6333"
      - "6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    restart: unless-stopped

volumes:
  redis_data:
  qdrant_data:
  gateway_data:
  gateway_logs:
