# CrabCache gateway config for Docker Compose (agent profile: gateway + Redis).
#
# === Cursor production preset ===
# .env: CRABCACHE_UPSTREAM_KEYS=sk-ds-1,sk-ds-2,sk-ds-3  (multi-key quota pool)
# Cursor: Base URL https://<domain>:18000/v1, API Key sk-cc-* (Management POST /v1/keys)
# After upgrade: POST /v1/cache/invalidate with x-cache-invalidate-confirm: all
# TLS: Let's Encrypt on OpenResty :18000 (strict curl /ready must return 200)
#
# Upstream DeepSeek API key pool: configure via Dashboard (recommended) or env vars.
# Real keys are stored in Redis (crab:state:upstream_keys) and hot-reloaded — no .env needed.
# The bootstrap key below satisfies startup validation; replace via Dashboard → Save Key Pool.
# Optional env overrides: CRABCACHE_API_KEY, CRABCACHE_UPSTREAM_KEYS, CRABCACHE_GATEWAY_ADMIN_KEY

listen_addr = "0.0.0.0:8080"
metrics_addr = "0.0.0.0:9090"
# Bootstrap placeholder — satisfies startup validation only. Configure real keys via Dashboard.
api_key = "sk-bootstrap-not-used-00000000"

[gateway]
default_upstream_profile = "deepseek"

[management]
listen_addr = "0.0.0.0:9080"
admin_key = "CrabCache-Admin-Secret-2026"

[limits]
max_request_body_bytes = 4194304
max_concurrent_requests = 512

[upstream]
# Origin only (no /v1). Override with CRABCACHE_UPSTREAM_BASE_URL / CRABCACHE_UPSTREAM_MODEL.
base_url = "https://api.deepseek.com"
model = "deepseek-v4-pro"
default_weight = 1
# Omit deepseek_endpoints to auto-derive host:443 from base_url.
deepseek_endpoints = ["api.deepseek.com:443"]
# keys = ["sk-ds-1", "sk-ds-2"]  # or CRABCACHE_UPSTREAM_KEYS in .env

[state]
backend = "redis"
redis_url = "redis://redis:6379"
key_prefix = "crab:state"
refresh_interval_secs = 5

[cache]
default_ttl_secs = 3600
l0_max_capacity = 10000
l0_ttl_secs = 3600
stream_cache_enabled = true
l1_redis_url = "redis://redis:6379"
l1_pool_size = 16
fingerprint_version = 1
fingerprint_normalize_content = true

[cache.model_ttl_overrides]
"deepseek-v4-pro" = 7200
"deepseek-v4-flash" = 3600

[semantic]
enabled = false
model_path = "models/all-MiniLM-L6-v2.onnx"
tokenizer_path = "models/tokenizer.json"
qdrant_url = "http://qdrant:6334"
collection_name = "crab_semantic_cache"
similarity_threshold = 0.95
ttl_secs = 86400

[reasoning]
backend = "redis"
redis_url = "redis://redis:6379"
max_reasoning_entry_bytes = 524288
thinking_mode = "enabled"
reasoning_effort = "medium"
# deepseek-cursor-proxy：recover（默认）| reject（409）
missing_reasoning_strategy = "recover"
# Set true only for dev/demo (folds thinking into Cursor content).
display_reasoning = false
collapsible_reasoning = true
cache_db_path = "/app/data/reasoning_content.sqlite3"
cache_max_age_secs = 2592000
cache_max_rows = 100000

[connection]
tcp_keepalive_idle_secs = 60
tcp_keepalive_interval_secs = 10
tcp_keepalive_count = 3
idle_timeout_secs = 90
# Upstream HTTP/2 ALPN when false; h2_ping applies when force_http1 = false
upstream_force_http1 = false
# Keepalive reduces per-request TLS handshakes (MiMo pre-header latency).
upstream_disable_keepalive = false
h2_ping_interval_secs = 30
upstream_request_timeout_secs = 300
upstream_write_timeout_secs = 300
upstream_connection_timeout_secs = 60
# Chrome-like ECDH curve order to reduce JA3 fingerprint mismatch with CDN WAF.
# Set to "" to use OpenSSL/Pingora defaults.
upstream_tls_curves = "X25519:P-256:P-384"

[trace_logging]
enabled = true
path = "/app/logs/trace.jsonl"
# Production: raise max_lines (e.g. 50000) and max_files (e.g. 10) under sustained traffic.
# max_lines = 50000
# max_files = 10
max_lines = 10000
max_files = 5

# Raw capture (packet-level analysis). Admin reads same path via gateway_logs volume.
[raw_capture]
enabled = true
dir = "/app/logs/raw_capture"
max_index_lines = 5000
max_body_files = 5000
mask_api_keys = false
skip_paths = ["/health", "/healthz", "/ready"]

[features]
# Shared Pingora Connector TCP+TLS pre-warm on new session fingerprints (see third_party/pingora-proxy/PATCH.md).
connection_prewarm = true
# MiMo: partial body read → upstream_peer while client uploads; finalize at EOS.
# Phase 1 safety fixes + defer finalize early exact cache landed; enable after gray gate below.
streaming_body_forward = false
streaming_body_forward_auto_disable_threshold = 3
# Gzip upload to upstream when body >= 4096 bytes (verify MiMo accepts Content-Encoding: gzip first).
upstream_request_gzip = false
upstream_request_gzip_min_bytes = 4096
# mimo_retire_prefix_messages = false
# mimo_keep_recent_turns = 6
