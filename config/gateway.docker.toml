# CrabCache gateway config for Docker Compose (agent profile: gateway + Redis).
#
# === Cursor production preset ===
# .env: CRABCACHE_UPSTREAM_KEYS=sk-ds-1,sk-ds-2,sk-ds-3  (multi-key quota pool)
# Cursor: Base URL https://<domain>:18000/v1, API Key sk-cc-* (Management POST /v1/keys)
# After upgrade: POST /v1/cache/invalidate with x-cache-invalidate-confirm: all
# TLS: Let's Encrypt on OpenResty :18000 (strict curl /ready must return 200)
#
# Required: CRABCACHE_API_KEY or CRABCACHE_UPSTREAM_KEYS (upstream DeepSeek key pool).
# Optional: CRABCACHE_GATEWAY_ADMIN_KEY, CRABCACHE_L1_REDIS_URL, CRABCACHE_MANAGEMENT_LISTEN

listen_addr = "0.0.0.0:8080"
metrics_addr = "0.0.0.0:9090"
# Overridden by CRABCACHE_API_KEY at startup (required for production).
api_key = "set-via-CRABCACHE_API_KEY-environment-variable"

[management]
listen_addr = "0.0.0.0:9080"
admin_key = "CrabCache-Admin-Secret-2026"

[limits]
max_request_body_bytes = 4194304
max_concurrent_requests = 512

[upstream]
# Origin only (no /v1). Override with CRABCACHE_UPSTREAM_BASE_URL / CRABCACHE_UPSTREAM_MODEL.
base_url = "https://api.deepseek.com"
model = "deepseek-v4-pro"
default_weight = 1
# Omit deepseek_endpoints to auto-derive host:443 from base_url.
deepseek_endpoints = ["api.deepseek.com:443"]
# keys = ["sk-ds-1", "sk-ds-2"]  # or CRABCACHE_UPSTREAM_KEYS in .env

[state]
backend = "redis"
redis_url = "redis://redis:6379"
key_prefix = "crab:state"
refresh_interval_secs = 5

[cache]
default_ttl_secs = 3600
l0_max_capacity = 10000
l0_ttl_secs = 3600
stream_cache_enabled = true
l1_redis_url = "redis://redis:6379"
l1_pool_size = 16
fingerprint_version = 1
fingerprint_normalize_content = true

[cache.model_ttl_overrides]
"deepseek-v4-pro" = 7200
"deepseek-v4-flash" = 3600

[semantic]
enabled = false
model_path = "models/all-MiniLM-L6-v2.onnx"
tokenizer_path = "models/tokenizer.json"
qdrant_url = "http://qdrant:6334"
collection_name = "crab_semantic_cache"
similarity_threshold = 0.95
ttl_secs = 86400

[reasoning]
backend = "redis"
redis_url = "redis://redis:6379"
max_reasoning_entry_bytes = 524288
thinking_mode = "enabled"
reasoning_effort = "medium"
# deepseek-cursor-proxy：recover（默认）| reject（409）
missing_reasoning_strategy = "recover"
display_reasoning = true
collapsible_reasoning = true
cache_db_path = "/app/data/reasoning_content.sqlite3"
cache_max_age_secs = 2592000
cache_max_rows = 100000

[connection]
tcp_keepalive_idle_secs = 60
tcp_keepalive_interval_secs = 10
tcp_keepalive_count = 3
idle_timeout_secs = 90
# Upstream to DeepSeek: force HTTP/1.1 (default true); h2_ping only applies when force_http1 = false
upstream_force_http1 = true
upstream_disable_keepalive = true
h2_ping_interval_secs = 30
upstream_request_timeout_secs = 300
upstream_write_timeout_secs = 300
upstream_connection_timeout_secs = 60
# Chrome-like ECDH curve order to reduce JA3 fingerprint mismatch with CDN WAF.
# Set to "" to use OpenSSL/Pingora defaults.
upstream_tls_curves = "X25519:P-256:P-384"

[trace_logging]
enabled = true
path = "/app/logs/trace.jsonl"
# Production: raise max_lines (e.g. 50000) and max_files (e.g. 10) under sustained traffic.
max_lines = 10000
max_files = 5
