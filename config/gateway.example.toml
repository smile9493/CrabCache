# CrabCache Gateway Configuration
# Copy this file to gateway.toml and fill in your API keys.

listen_addr = "0.0.0.0:8080"
metrics_addr = "0.0.0.0:9090"
api_key = "sk-your-deepseek-api-key-here"

# Management HTTP API (Admin / control plane). Default binds loopback only.
# In Docker set CRABCACHE_MANAGEMENT_LISTEN=0.0.0.0:9080 so peer containers can reach it.
[management]
listen_addr = "127.0.0.1:9080"
admin_key = "dev-only-gateway-admin-secret"

[upstream]
base_url = "https://api.deepseek.com"
model = "deepseek-v4-pro"
default_weight = 1

# DeepSeek API endpoint addresses (for Ketama routing)
deepseek_endpoints = ["api.deepseek.com:443"]

# Optional: TLS SNI override for upstream connections (defaults to "api.deepseek.com")
# tls_sni = "api.deepseek.com"

# Health check interval in seconds for upstream backends (default: 30)
# health_check_interval_secs = 30

# Coalescer configuration
# Max concurrent inflight coalesce requests (default: 1000)
# max_coalesce_inflight = 1000
# Coalesce wait timeout in seconds (default: 60)
# coalesce_timeout_secs = 60

[cache]
default_ttl_secs = 3600
l0_max_capacity = 10000
l0_ttl_secs = 3600
l1_redis_url = "redis://127.0.0.1:6379"
l1_pool_size = 16

# When true, streaming responses are cached (stores raw SSE bytes for exact replay).
# Defaults to false; when disabled avoids synthetic SSE on hit.
# stream_cache_enabled = true

# Fingerprint normalization version for cache keys.
# Bump this when fingerprint normalization rules change to safely
# invalidate old cached entries in Redis (L1) without downtime.
# Default: 1
fingerprint_version = 1

# Normalize message content before hashing for cache keys.
# When true (default), whitespace, line endings (\r\n → \n), and Unicode
# NFC normalization are applied so that semantically identical requests
# with different encodings share the same cache entry.
# Set to false to disable normalization (emergency rollback).
fingerprint_normalize_content = true
[cache.model_ttl_overrides]
"deepseek-v4-pro" = 7200
"deepseek-v4-flash" = 3600

# Per-consumer TTL overrides (seconds)
[cache.consumer_overrides]
"reporting-job" = 1800

# Optional cost-saved pricing for Prometheus metrics (gateway_cache_cost_saved_usd_total).
# Prices are in USD per million tokens. Defaults to DeepSeek v3 pricing if omitted.
[cache.pricing]
default_input_price_per_million = 0.55
default_output_price_per_million = 2.19

# Per-model pricing overrides (optional)
[cache.pricing.model_overrides]
# "deepseek-v4-pro" = { input_price_per_million = 0.27, output_price_per_million = 1.10 }

[semantic]
enabled = false
model_path = "models/all-MiniLM-L6-v2.onnx"
tokenizer_path = "models/tokenizer.json"
qdrant_url = "http://127.0.0.1:6334"
collection_name = "crab_semantic_cache"
similarity_threshold = 0.95
ttl_secs = 86400
# Minimum query length (characters) to trigger L2 semantic search.
# Queries shorter than this skip embedding entirely.
# min_query_chars = 32
# Maximum query length (characters) to trigger L2 semantic search.
# Queries longer than this skip embedding entirely.
# max_query_chars = 8192
# Maximum concurrent ONNX embed operations (semaphore).
# max_concurrent_embeds = 4
# When true, L2 search is only attempted when L0/L1 exact cache misses.
# embed_only_on_exact_miss = true

[reasoning]
thinking_mode = "enabled"
reasoning_effort = "max"
missing_reasoning_strategy = "recover"
display_reasoning = true
collapsible_reasoning = true
cache_db_path = "data/reasoning_content.sqlite3"
cache_max_age_secs = 2592000
cache_max_rows = 100000

[connection]
tcp_keepalive_idle_secs = 60
tcp_keepalive_interval_secs = 10
tcp_keepalive_count = 3
idle_timeout_secs = 90
h2_ping_interval_secs = 30

[trace_logging]
enabled = true
path = "/var/log/crabcache/trace.jsonl"
max_lines = 10000
max_files = 5
