# CrabCache Gateway Configuration
# Copy this file to gateway.toml and fill in your API keys.
#
# Cursor production preset:
#   - CRABCACHE_UPSTREAM_KEYS with 2+ DeepSeek keys (comma-separated in .env)
#   - Cursor uses sk-cc-* only; upstream sk-ds-* stays on the server
#   - [reasoning] reasoning_effort = "medium", missing_reasoning_strategy = "recover"
#   - Models: deepseek-v4-flash or deepseek-v4-flash-max (suffix auto-mapped)
#   - See docs/CURSOR_SETUP.md and scripts/verify_cursor_e2e.sh

listen_addr = "0.0.0.0:8080"
metrics_addr = "0.0.0.0:9090"
# Upstream key: configure via Dashboard (Save Key Pool) — preferred workflow.
# The bootstrap placeholder passes startup validation; real keys are loaded from Redis at runtime.
# Only set api_key here if you don't use Redis state or Dashboard.
api_key = "sk-bootstrap-not-used-00000000"

# Client auth: when false (default), only sk-cc-* keys from Management API may call the gateway.
# When true, api_key may still be used as a client Bearer (not recommended in production).
[gateway]
legacy_api_key_as_client_auth = false
# cors_enabled = false
# Default upstream profile when model/key do not specify one (see [[upstream.profiles]]).
default_upstream_profile = "deepseek"
# auto | force_cursor_v4 — auto selects CursorDeepSeekV4 / DeepSeekLight / GenericRelay per request.
pipeline_mode = "auto"

# Cursor model aliases (OpenAI-style ids → DeepSeek upstream). See docs/CURSOR_SETUP.md.
[gateway.cursor_models]
force_deepseek_profile_for_aliases = true
# synthetic_models_enabled = false

[gateway.cursor_models.aliases]
gpt-4o = { upstream = "deepseek-v4-pro", pipeline = "cursor_deepseek_v4" }
gpt-4 = { upstream = "deepseek-v4-pro", pipeline = "cursor_deepseek_v4" }
deepseek-chat = { upstream = "deepseek-chat", pipeline = "deepseek_light" }

# ── Declarative Pipeline Rules (optional) ──────────────────────────────
# When [gateway.pipeline] is present with rules, the rule engine evaluates
# rules in priority order before falling back to the legacy if/match logic.
# Omit this section entirely to use legacy behavior (100% backward compatible).
#
# [gateway.pipeline]
# default = "generic_relay"
#
# [[gateway.pipeline.rules]]
# name = "cursor_deepseek_v4"
# priority = 10
# pipeline = "cursor_deepseek_v4"
# [gateway.pipeline.rules.match]
# client = ["cursor"]
# provider = ["deepseek"]
# model_pattern = ["deepseek-v4-*"]
#
# [[gateway.pipeline.rules]]
# name = "codex_relay"
# priority = 20
# pipeline = "codex_relay"
# [gateway.pipeline.rules.match]
# client = ["codex"]
# provider = ["codex"]
# # Optional wire_format filter: ["chat_completions", "responses", "anthropic", "canonical"]
# # Omit to match any wire format.
# # wire_format = ["responses"]
#
# [[gateway.pipeline.rules]]
# name = "codex_to_deepseek"
# priority = 25
# pipeline = "codex_deepseek"
# [gateway.pipeline.rules.match]
# client = ["codex"]
# provider = ["deepseek"]
# model_pattern = ["deepseek-*"]
#
# [[gateway.pipeline.rules]]
# name = "deepseek_light"
# priority = 30
# pipeline = "deepseek_light"
# [gateway.pipeline.rules.match]
# provider = ["deepseek"]
# # No model_pattern → all DeepSeek models (lower priority than cursor rule)
#
# [[gateway.pipeline.rules]]
# name = "mimo_relay"
# priority = 40
# pipeline = "mimo_token_plan_relay"
# [gateway.pipeline.rules.match]
# provider = ["mimo"]

# Management HTTP API (Admin / control plane). Default binds loopback only.
# In Docker set CRABCACHE_MANAGEMENT_LISTEN=0.0.0.0:9080 so peer containers can reach it.
[management]
listen_addr = "127.0.0.1:9080"
# Management API key (x-gateway-admin-key). NOT the client api_key above — use a strong secret in production.
admin_key = "dev-only-gateway-admin-secret"
# Max seconds for background Redis SCAN during POST /v1/cache/invalidate (default: 300)
# invalidate_scan_timeout_secs = 300

[limits]
# Max inbound chat completion request body (default 4 MiB)
max_request_body_bytes = 4194304
# Max concurrent in-flight chat requests (default 512)
max_concurrent_requests = 512

[upstream]
# Upstream relay origin (OpenAI-compatible). Do not include /v1 — paths are appended by the gateway.
# Override at runtime: CRABCACHE_UPSTREAM_BASE_URL, CRABCACHE_UPSTREAM_MODEL
# Hot-reload via Management API: PUT /v1/upstream/relay
base_url = "https://api.deepseek.com"
model = "deepseek-v4-pro"
default_weight = 1

# DeepSeek upstream API key pool (quota aggregation). If empty, top-level api_key is used.
# keys = ["sk-ds-account-1", "sk-ds-account-2"]
# Cooldown seconds after HTTP 429 before reusing a key (default 60)
# key_cooldown_secs = 60
# Per-key account_id (via Management API / Dashboard as account_id:sk-...) groups keys for
# 429 rotation: only keys with a different account_id are tried after rate limit.

# Optional per-project_id (upstream user_id) concurrency soft limits for DeepSeek v4 models.
# Disabled by default; enable when using expanded per-user_id quotas (v4-pro 500 / v4-flash 2500).
# [upstream.deepseek_user_concurrency]
# enabled = false
# v4_pro_per_user_id = 500
# v4_flash_per_user_id = 2500

# Ketama peer addresses (host:port). When omitted, derived from base_url host (port 443/80).
deepseek_endpoints = ["api.deepseek.com:443"]

# Optional multi-vendor upstream profiles (each has its own key pool and router).
# When omitted, a single `deepseek` profile is built from [upstream] above.
# Profiles can also be created/updated at runtime via Management API or Admin Dashboard
# (Upstream page); changes are persisted to the control-plane Redis snapshot.
# [[upstream.profiles]]
# id = "deepseek"
# provider = "deepseek"
# base_url = "https://api.deepseek.com"
# endpoints = ["api.deepseek.com:443"]
# model = "deepseek-v4-pro"
# keys = ["sk-ds-1"]
#
# [[upstream.profiles]]
# id = "openai"
# provider = "openai"
# base_url = "https://api.openai.com"
# endpoints = ["api.openai.com:443"]
# model = "gpt-4o"
# keys = ["sk-openai-1"]
#
# [[upstream.profiles]]
# id = "mimo"
# provider = "mimo"
# base_url = "https://api.xiaomimimo.com"
# endpoints = ["api.xiaomimimo.com:443"]
# model = "xiaomi/mimo-v2.5-pro"
# keys = ["your-xiaomi-mimo-api-key"]
# # OpenAI-compatible path: /v1/chat/completions
# # Model ids are normalized to xiaomi/{name} (e.g. mimo-v2.5-pro → xiaomi/mimo-v2.5-pro)

# Optional: TLS SNI override (defaults to hostname from base_url)
# tls_sni = "api.deepseek.com"

# Health check interval in seconds for upstream backends (default: 30)
# health_check_interval_secs = 30

# Coalescer configuration
# Max concurrent inflight coalesce requests (default: 1000)
# max_coalesce_inflight = 1000
# Coalesce wait timeout in seconds (default: 60)
# coalesce_timeout_secs = 60

# Control plane persistence (client keys, TTL/routing, domain policies, connection).
# Single instance / bare-metal dev: backend = "memory" (default).
# Multi-gateway replicas or docker compose --scale gateway=N: backend = "redis"
#   (see config/gateway.docker.toml; env CRABCACHE_STATE_BACKEND=redis).
[state]
backend = "memory"
# redis_url = ""      # empty → reuse cache.l1_redis_url
# key_prefix = "crab:state"
# refresh_interval_secs = 5
# pool_size = 12
# connection_timeout_secs = 10

[cache]
default_ttl_secs = 3600
l0_max_capacity = 10000
l0_ttl_secs = 3600
# l0_max_entry_bytes = 1048576  # P3-5: Enable byte-level L0 eviction (1MB per entry cap).
                                # When set, max_capacity becomes total byte budget (e.g. 100000000 = ~100MB).
# Bare-metal / local dev: redis on localhost.
# Docker Compose: use redis://redis:6379 (see config/gateway.docker.toml) or CRABCACHE_L1_REDIS_URL.
l1_redis_url = "redis://127.0.0.1:6379"
l1_pool_size = 16
# l1_connection_timeout_secs = 10

# When true, streaming responses are cached (stores raw SSE bytes for exact replay).
# Defaults to false; when disabled avoids synthetic SSE on hit.
# stream_cache_enabled = true
# Max raw SSE bytes stored per stream cache entry (default: 4194304 = 4 MiB). 0 = JSON-only + synthetic SSE on hit.
# max_sse_cache_bytes = 4194304

# Fingerprint normalization version for cache keys.
# Bump this when fingerprint normalization rules change to safely
# invalidate old cached entries in Redis (L1) without downtime.
# Default: 1
fingerprint_version = 1

# Normalize message content before hashing for cache keys.
# When true (default), whitespace, line endings (\r\n → \n), and Unicode
# NFC normalization are applied so that semantically identical requests
# with different encodings share the same cache entry.
# Set to false to disable normalization (emergency rollback).
fingerprint_normalize_content = true

# Optional global prefix for L0/L1 cache keys. Per-request project_id (API key or X-Project-Id)
# is combined as "{cache_key_namespace}:{project_id}:{hash}" when both are set.
# See docs/MULTI_TENANT.md.
# cache_key_namespace = "org"

[cache.model_ttl_overrides]
"deepseek-v4-pro" = 7200
"deepseek-v4-flash" = 3600
# "xiaomi/mimo-v2.5-pro" = 7200
# "xiaomi/mimo-v2-flash" = 3600

# Per-consumer TTL overrides (seconds)
[cache.consumer_ttl_overrides]
"reporting-job" = 1800

# Optional cost-saved pricing for Prometheus metrics (gateway_cache_cost_saved_usd_total).
# Prices are in USD per million tokens. Defaults to DeepSeek v3 pricing if omitted.
[cache.pricing]
default_input_price_per_million = 0.55
default_output_price_per_million = 2.19

# Per-model pricing overrides (optional)
[cache.pricing.model_overrides]
# "deepseek-v4-pro" = { input_price_per_million = 0.27, output_price_per_million = 1.10 }
# "xiaomi/mimo-v2.5-pro" = { input_price_per_million = 1.00, output_price_per_million = 3.00 }
# "xiaomi/mimo-v2.5" = { input_price_per_million = 0.40, output_price_per_million = 2.00 }

[semantic]
enabled = false
model_path = "models/all-MiniLM-L6-v2.onnx"
tokenizer_path = "models/tokenizer.json"
qdrant_url = "http://127.0.0.1:6334"
collection_name = "crab_semantic_cache"
similarity_threshold = 0.95
ttl_secs = 86400
# Minimum query length (characters) to trigger L2 semantic search.
# Queries shorter than this skip embedding entirely.
# min_query_chars = 32
# Maximum query length (characters) to trigger L2 semantic search.
# Queries longer than this skip embedding entirely.
# max_query_chars = 8192
# Maximum concurrent ONNX embed operations (semaphore).
# max_concurrent_embeds = 4
# When true, L2 search is only attempted when L0/L1 exact cache misses.
# embed_only_on_exact_miss = true

[reasoning]
# Multi-instance / Docker: backend = "redis" (gateway.docker.toml).
# Single-process dev: omit backend or backend = "sqlite".
backend = "redis"
redis_url = "redis://127.0.0.1:6379"
max_reasoning_entry_bytes = 524288
thinking_mode = "enabled"
reasoning_effort = "max"
# recover (default) | reject (409 only) — same as deepseek-cursor-proxy
missing_reasoning_strategy = "recover"
# Append tail summary when message count exceeds threshold (0 = disabled, L3-safe append-only)
# context_summary_message_threshold = 0
# prefix_validate = false
# true: mirror/fold thinking into assistant content for Cursor UI
# false: silent mode (dsv4-cc-proxy style) — ReasoningStore keeps upstream text; client sees answer/tool_calls only
display_reasoning = false
collapsible_reasoning = true
cache_db_path = "data/reasoning_content.sqlite3"
cache_max_age_secs = 2592000
cache_max_rows = 100000

[connection]
tcp_keepalive_idle_secs = 60
tcp_keepalive_interval_secs = 10
tcp_keepalive_count = 3
idle_timeout_secs = 120
# false = negotiate HTTP/2 with upstream (h2_ping_interval_secs applies); true = force HTTP/1.1
upstream_force_http1 = false
upstream_disable_keepalive = false
h2_ping_interval_secs = 30
upstream_request_timeout_secs = 300
upstream_write_timeout_secs = 300
upstream_connection_timeout_secs = 60

[trace_logging]
enabled = true
# Trace log file path. Each line is a JSON-serialized SanitizedLogEntry.
# Includes DeepSeek user_id audit fields: upstream_user_id, client_body_user_id,
# user_id_audit (injected/absent/...), upstream_profile_id, pipeline, upstream_model.
# Dashboard Trace page shows deepseek_user_id isolation summary (no max_payload_bytes required).
# When the crab-composition crate is enabled, each entry also includes `composition`.
# See docs/OBSERVABILITY.md.
path = "/var/log/crabcache/trace.jsonl"
# Production: raise max_lines (e.g. 50000) and max_files (e.g. 10) under sustained Cursor traffic.
# max_lines = 50000
# max_files = 10
max_lines = 10000
max_files = 5

# Max bytes to capture for request body snapshot in trace logs (`0` = disabled).
# Enable cautiously: each line grows from ~200 B to KB-scale. Suggested production
# values: request 512–2048, response 256–1024. Requires sufficient disk headroom
# when combined with max_lines × max_files.
# max_payload_bytes = 1024
# max_response_preview_bytes = 512

# PG direct write: gateway writes trace_logs directly to PostgreSQL via a
# dedicated writer thread, bypassing the old JSONL→Admin pg_sync 10-second lag.
# When set, JSONL is still written as a local fallback buffer, but Admin
# queries use PG as the sole authoritative source. The old pg_sync task
# has been removed; this is now the only PG write path.
# Env override: CRABCACHE_TRACE_PG_URL
# pg_url = "postgres://user:pass@127.0.0.1:5432/crabcache"

# Optional: debug composition logging (full system/tools text for analysis)
# When enabled, writes full (unhashed) system prompts and tool definitions
# to a separate JSONL file. Use for offline composition analysis only —
# this file may contain sensitive prompt content.
# [trace_logging.composition_debug]
# enabled = false
# path = "/var/log/crabcache/trace-debug.jsonl"
# max_lines = 5000
# max_files = 3

# ── Raw Capture (packet-level request analysis) ─────────────────
# Captures full client + upstream JSON bodies per request for offline
# packet structure analysis. Designed for diagnosing DeepSeek V4
# thinking mode context explosion and downstream client issues.
#
# SECURITY: Raw bodies contain API keys and full prompts.
#   - Default is OFF. Only enable in controlled/internal environments.
#   - Set file permissions to 600 on the capture directory.
#   - Do NOT expose the capture directory to the public internet.
#
# DISK: Each capture stores ~2x body size. For 64 MiB bodies, a single
#   request can write up to 128 MiB. Monitor disk usage and adjust
#   max_body_files to cap storage.
#
# Admin API: GET /api/admin/capture/list, /capture/{id}, /capture/stats
# Dashboard: Requests page → Capture tab (client/upstream comparison)
#
# [raw_capture]
# enabled = false
# dir = "/var/log/crabcache/raw_capture"
# max_index_lines = 5000
# max_body_files = 5000
# max_client_bytes = 0   # 0 = no limit (64 MiB gateway limit applies)
# max_upstream_bytes = 0
# mask_api_keys = false  # true = mask sk-* tokens in captured bodies
# skip_paths = ["/health", "/healthz", "/ready"]
# sample_rate = 1.0                # 0.0~1.0, fraction of normal requests to capture
# sample_always_on_error = true    # always capture 4xx/5xx upstream responses
# sample_always_on_large_body = false  # always capture requests > min_body_bytes_for_large
# min_body_bytes_for_large = 2097152   # 2 MiB threshold for large-body override

# ── Experimental Feature Flags ────────────────────────────────────
# Each feature is independent and default off. Enable at your own risk.
# [features]
# prefix_aware_cache = false         # L0 prefix index only on shared prefixes (no full-response short-circuit)
# streaming_body_forward = false     # MiMo: partial read + upstream_peer before body EOS; see docs/STREAMING_BODY_FORWARD.md
# streaming_body_forward_auto_disable_threshold = 3  # consecutive parse/empty-body failures → disable defer for 60s
# connection_prewarm = false         # Direct pool pre-warm: shared Pingora Connector, TCP+TLS only (no loopback HTTP).
#                                    # Startup: all backends; runtime: first upstream_peer per new session_fingerprint.
# affinity_prompt_cache_feedback = false  # Sticky backend hint from upstream prompt_cache_* tokens; invalidate after 3 consecutive pure misses at request end
# delta_cache = false                # Experimental differential cache (docs/DATA_PLANE_P3.md)
# io_uring_backend = false           # Reserved: Pingora io_uring backend
# wasm_filters = false               # Experimental WASM filters (docs/DATA_PLANE_P3.md)
# mimo_context_compression = false   # Auto-summarize old MiMo messages
# mimo_compression_threshold = 40    # Message count to trigger compression
# upstream_request_gzip = false      # Gzip request bodies to upstream when >= min bytes
# upstream_request_gzip_min_bytes = 4096
# mimo_retire_prefix_messages = false  # Trim old MiMo turns before upstream (cache keys unchanged)
# mimo_keep_recent_turns = 6
# mimo_session_store = false           # Redis canonical messages per stable session (upstream only)
# mimo_session_store_ttl_secs = 86400
# mimo_session_store_max_messages = 200
# responses_chain_redis = true         # Persist Codex/Responses previous_response_id chains (Moka L0 + Redis L1)
# responses_chain_ttl_secs = 3600
# responses_chain_max_capacity = 50000
# responses_chain_max_value_bytes = 262144
# responses_chain_max_output_items = 64
# passthrough_prefix_bytes = 1024       # Minimum body bytes to trigger MiMo passthrough (overlap connect + upload)
# mimo_key_binding = false              # Conversation-level upstream key binding for MiMo (lock key per conversation)
# mimo_key_binding_ttl_secs = 300       # Idle TTL (seconds) for key bindings; 5 minutes default
# mimo_key_max_inflight = 3             # Max concurrent requests per bound key (0 = unlimited)
# codex_key_binding = false             # Session → Codex OAuth account binding (overflow spill on saturation)
# codex_key_binding_ttl_secs = 300
# codex_key_max_inflight = 3
# codex_key_overflow_wait_ms = 200      # Wait on bound key before spill (ms)
# codex_acquire_fill_first = true         # Deprioritize keys with recent 429/capacity strikes
# codex_retry_budget_max = 3              # Same-request retries scale with min(pool-1, this cap)
# codex_quota_preflight = true            # Check WHAM before acquiring upstream key (quota-aware selection)
# codex_quota_min_remaining_percent = 2.0 # Minimum remaining % to keep using a key (OmniRoute default)
# codex_quota_cache_ttl_secs = 60         # WHAM cache TTL in seconds (0 = always re-fetch)
# codex_quota_background_refresh = true   # Background refresh of WHAM quota data for active keys

# ── Multi-Layer Resilience (Circuit Breaker / Lockout) ───────────
# Inspired by OmniRoute's 4-layer resilience architecture.
# These flags live under [features]:
# client_lockout_enabled = true          # Client-level lockout (brute-force auth protection)
# client_lockout_max_attempts = 5        # Max failed attempts before lockout
# client_lockout_duration_secs = 900     # Lockout duration (15 minutes)
# client_lockout_attempt_window_secs = 300  # Sliding window for counting failures (5 minutes)
# model_lockout_enabled = true           # Model-level lockout (per-profile/backend/model cooldowns)
#
# ── P1-1: Multi-factor Weighted Routing ──────────────────────────
# When backend_route_strategy = "weighted_ketama", the gateway scores all
# ready backends on 5 factors and picks the highest-scoring one.
# backend_load_aware_routing_enabled = false
# backend_route_strategy = "ketama"      # ketama | p2c | least_used | cost_optimized | weighted_ketama
# backend_concurrency_limit_enabled = false
# default_max_inflight_per_backend = 8
# backend_prefill_overload_threshold_ms = 0   # 0 = disabled
# backend_overload_cooldown_ms = 30000
# [features.score_weights]
# health = 0.30           # Backend health status (ready/not_ready)
# latency_inv = 0.25      # Inverse P95 latency (faster = higher score)
# load_inv = 0.20         # Inverse active connections (less loaded = higher)
# affinity_hit = 0.15     # Prompt-cache affinity hit rate
# rate_429_inv = 0.10     # Inverse 429 rate (fewer rate limits = higher)
#
# ── P1-2: Quota Preflight (Backend Health Gating) ────────────────
# [features.preflight]
# enabled = false
# cooldown_ms = 60000          # 429 cooldown window (ms)
# max_consecutive_429 = 3      # Consecutive 429s before skipping backend
# skip_threshold = 0.5         # 429-rate threshold to skip backend
#
# ── P2-4: Idempotency Layer ──────────────────────────────────────
# Client-controlled dedup using Idempotency-Key or X-Request-Id header.
# Complements Request Coalescing (which merges concurrent identical requests).
# [cache.idempotency]
# enabled = true
# window_secs = 5               # TTL window for idempotent responses
# max_entries = 10000            # Max entries in memory

# ── OAuth TLS Fingerprint Emulation ──────────────────────────────
# OAuth outbounds (Claude/Gemini/xAI/Codex token exchange) use wreq + Chrome
# browser TLS/HTTP2 fingerprint (JA3/JA4 level). Configure via env var:
#   CRABCACHE_OAUTH_TLS_EMULATION=chrome130  (default, aligns with wreq-util current)
#   CRABCACHE_OAUTH_TLS_EMULATION=chrome124  (aligns with OmniRoute's wreq-js)
# Note: main proxy upstream (chat/completions) uses Pingora BoringSSL, NOT wreq;
#       its TLS is controlled by [connection] upstream_tls_curves, not JA3/JA4.

# ── Token Compression Pipeline (SSE Stream) ─────────────────────
# [compression]
# enabled = false
# deduplicate_content_deltas = true   # suppress consecutive identical content deltas
# truncate_long_content = false       # truncate tool output content > threshold
# max_content_chars = 4096            # truncation threshold (chars)

# ── Multi-Routing Strategies ─────────────────────────────────────
# Extend beyond Ketama with P2C, cost-optimized, and round-robin.
# Per-profile: set routing_strategy in [[upstream.profiles]].
# [routing]
# default_strategy = "ketama"        # ketama | p2c | cost_optimized | round_robin

# ── Guardrails (PII / Prompt Injection) ──────────────────────────
# [guardrails]
# enabled = true
# # PII detection/redaction in messages[].content
# pii_detection = "off"              # off | detect | redact
# # Prompt injection detection
# injection_detection = false
# injection_mode = "warn"            # block | warn | log
# injection_threshold = "high"       # low | medium | high
# # Custom regex patterns for injection detection
# custom_patterns = []

# ── Bypass Handler ───────────────────────────────────────────────
# Intercept well-known request patterns and return canned responses
# to avoid consuming tokens or hitting upstream APIs.
# [bypass]
# enabled = true
# skip_patterns = ["Warmup", "count"]  # substrings to match in message content

# ── Log Retention (Admin Dashboard) ──────────────────────────────
# The admin dashboard runs a background cleanup task every 10 minutes
# that enforces these retention limits. Configure via env vars:
#   CRABCACHE_LOG_MAX_AGE_HOURS     (default: 168 = 7 days)
#   CRABCACHE_LOG_MAX_DISK_MB       (default: 500)
#   CRABCACHE_LOG_MAX_TRACE_FILES   (default: 20)
#   CRABCACHE_LOG_MAX_CAPTURE_BODY_FILES (default: 5000)
# Retention can also be updated at runtime via the Dashboard UI or:
#   PUT /api/admin/logs/retention
# Manual cleanup:
#   POST /api/admin/logs/clear
# Disk usage:
#   GET /api/admin/logs/usage

# ── Event Bus & Webhooks ─────────────────────────────────────
# Event bus for gateway-wide pub/sub notifications (webhook delivery, etc.)
# [event_bus]
# capacity = 1024              # Event bus channel capacity

# Webhook delivery configuration
# [webhook]
# enabled = true
# delivery_timeout_secs = 10   # HTTP delivery timeout
# max_retries = 3              # Max retry attempts
# retry_base_delay_ms = 1000   # Base delay for exponential backoff
