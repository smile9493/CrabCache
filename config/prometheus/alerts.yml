# CrabCache gateway alert rules (example thresholds — tune per workload).

groups:
  - name: crabcache_gateway
    rules:
      - alert: CrabCacheLowGatewayHitRate
        expr: |
          sum(rate(gateway_cache_requests_total{result="hit"}[5m]))
          / sum(rate(gateway_cache_requests_total[5m])) < 0.30
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Gateway L0-L2 hit rate below 30% (5m)"
          description: "Request-level cache hit rate has been low for 10 minutes."

      - alert: CrabCacheL1FetchLatencyHigh
        expr: |
          (
            sum(rate(gateway_cache_fetch_latency_seconds_sum{tier="L1_redis"}[5m]))
            / sum(rate(gateway_cache_fetch_latency_seconds_count{tier="L1_redis"}[5m]))
          ) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "L1 Redis cache fetch P99 avg > 50ms (5m)"
          description: "Check Redis connectivity, memory, and network latency."

      - alert: CrabCacheCoalescingSpike
        expr: rate(gateway_coalesced_requests_total[5m]) > 10
        for: 5m
        labels:
          severity: info
        annotations:
          summary: "High request coalescing rate"
          description: "Many concurrent duplicate cache keys; may indicate hot keys or fingerprint churn."

      - alert: CrabCacheSemanticRejectRatioHigh
        expr: |
          sum(rate(gateway_semantic_cache_requests_total{status="rejected_by_guard"}[5m]))
          / (
            sum(rate(gateway_semantic_cache_requests_total[5m]))
            + sum(rate(gateway_semantic_skipped_total[5m]))
          ) > 0.50
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Semantic cache guard rejection ratio > 50%"
          description: "Review similarity threshold and model guard settings."

  - name: crabcache_domain
    rules:
      - alert: CrabCacheDomainHitRateLow
        expr: |
          (
            sum by (domain) (rate(gateway_deepseek_input_tokens_total{cache_status="hit"}[1h]))
            / clamp_min(sum by (domain) (rate(gateway_deepseek_input_tokens_total[1h])), 1e-9)
          ) < 0.85
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Domain {{ $labels.domain }} token hit rate below 85% (1h)"

      - alert: CrabCacheDomainQuotaExceeded
        expr: increase(gateway_rejected_requests_total{reason="domain_quota_exceeded"}[5m]) > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Domain quota rejections detected"
