# Example Prometheus alert rules for CrabCache upstream key pool.
# Mount or merge into your Prometheus rule_files.

groups:
  - name: crabcache_upstream_keys
    rules:
      - alert: CrabCacheUpstreamKeysExhausted
        expr: |
          increase(gateway_rejected_requests_total{reason="upstream_key_exhausted"}[5m]) > 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "CrabCache has no available upstream DeepSeek keys"
          description: "All keys may be in cooldown or disabled. New upstream requests return 503."

      - alert: CrabCacheUpstreamKeyRateLimited
        expr: |
          (
            sum by (key_id) (rate(gateway_upstream_key_requests_total{result="rate_limited"}[5m]))
            /
            clamp_min(sum by (key_id) (rate(gateway_upstream_key_requests_total[5m])), 1e-9)
          ) > 0.5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "CrabCache upstream key {{ $labels.key_id }} heavily rate limited"
          description: "More than 50% of requests on this key_id received HTTP 429 in the last 10m."

      - alert: CrabCacheUpstreamKeyErrors
        expr: |
          sum(rate(gateway_upstream_key_requests_total{result="error"}[5m])) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "CrabCache upstream key errors elevated"
          description: "Check for 401-disabled keys or upstream outages."

  - name: crabcache_l3_prefix_cache
    rules:
      - alert: CrabCacheL3PrefixCacheHitRateLow
        expr: |
          (
            sum(increase(gateway_upstream_prompt_cache_tokens_total{status="hit"}[1h]))
            /
            clamp_min(
              sum(increase(gateway_upstream_prompt_cache_tokens_total[1h])),
              1
            )
          ) < 0.85
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "CrabCache L3 upstream prefix cache hit rate below 85% (1h)"
          description: |
            Check x-conversation-id stickiness, reasoning strategy (prefer fill_only),
            and whether clients mutate message prefixes. See docs/DEEPSEEK_PREFIX_CACHE.md.

  - name: crabcache_domain_cache
    rules:
      - alert: CrabCacheDomainHitRateLow
        expr: |
          (
            sum by (domain) (rate(gateway_deepseek_input_tokens_total{cache_status="hit"}[1h]))
            /
            clamp_min(
              sum by (domain) (rate(gateway_deepseek_input_tokens_total[1h])),
              1e-9
            )
          ) < 0.85
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "CrabCache domain {{ $labels.domain }} token hit rate below 85% (1h)"
          description: |
            Review API keys assigned to this domain and cache TTL settings.
            Unclassified traffic uses domain label `unclassified`.

      - alert: CrabCacheDomainRejectedQuota
        expr: |
          increase(gateway_rejected_requests_total{reason="domain_quota_exceeded"}[5m]) > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "CrabCache rejected requests due to domain quota"
          description: |
            One or more domains exceeded monthly token or cost budget configured via
            PUT /v1/domains/policies. Adjust budgets or key assignment.

  - name: crabcache_data_plane
    rules:
      - alert: CrabCacheBackgroundTaskUnhealthy
        expr: gateway_background_task_healthy == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "CrabCache background task {{ $labels.task }} unhealthy"
          description: "A background task has reported unhealthy status for >2 minutes."

      - alert: CrabCacheActiveRequestsHigh
        expr: |
          gateway_active_requests > 800
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "CrabCache active requests near limit ({{ $value }})"
          description: "Active requests approaching max_concurrent_requests. Check for upstream slowdowns."

      - alert: CrabCacheStreamCaptureTruncated
        expr: |
          rate(gateway_stream_capture_truncated_total[15m]) > 0.1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "CrabCache stream capture truncation elevated"
          description: "SSE stream buffers being truncated at a high rate. Check max_sse_cache_bytes."

      - alert: CrabCacheRetryBufferTruncated
        expr: |
          rate(gateway_retry_buffer_truncated_total[5m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "CrabCache retry buffer truncation detected"
          description: "Pingora 64 KiB retry buffer truncation events detected. Request bodies may be incomplete."

      - alert: CrabCachePgTraceFailures
        expr: |
          rate(gateway_trace_write_total{sink="pg",result="failure"}[5m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "CrabCache PG trace write failures"
          description: "PG trace batch inserts failing. Check PG connectivity and disk space."

      - alert: CrabCachePgTraceDrops
        expr: |
          rate(gateway_trace_pg_dropped_total[5m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "CrabCache PG trace entries dropped"
          description: "PG trace queue is full or disconnected. Entries are being dropped."

      - alert: CrabCacheHighGlobalRps
        expr: |
          gateway_global_rps > 500
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "CrabCache global RPS elevated ({{ $value }})"
          description: "Request rate is high. Monitor upstream latency and cache hit rate."
