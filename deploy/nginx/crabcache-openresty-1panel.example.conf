# 1Panel OpenResty — 无公网 80/443，使用域名:端口 + HTTPS
# API:  https://your-domain.example.com:18000/v1
# Admin: https://your-domain.example.com:18010
#
# Install certs to /www/sites/your-domain.example.com/ssl/ (fullchain.pem + privkey.pem)
# then include this file from 1Panel site conf or copy to /opt/1panel/www/conf.d/
#
# ReasoningStore: optional stable x-conversation-id for Cursor (see docs/REASONING_STORE.md).
# Uncomment ONE pattern below in the API server block, or add to http {} for map B.

# Example B (default): stable x-conversation-id from Bearer sk-cc-* prefix + optional cookie override
map $http_authorization $crabcache_conv_id {
    default "";
    "~^Bearer\s+(.{8,24})" "auth-$1";
}
map $crabcache_conv_id $crabcache_conv_id_final {
    default $cookie_crabcache_thread_id;
    ""      $crabcache_conv_id;
}

server {
    listen 18000 ssl;
    http2 on;
    server_name your-domain.example.com;

    ssl_certificate     /www/sites/your-domain.example.com/ssl/fullchain.pem;
    ssl_certificate_key /www/sites/your-domain.example.com/ssl/privkey.pem;

    client_max_body_size 4m;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_connect_timeout 60s;

    location ^~ / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        # ReasoningStore stable session (Example B; override with cookie crabcache_thread_id)
        proxy_set_header x-conversation-id $crabcache_conv_id_final;
        # Example A only: proxy_set_header x-conversation-id $cookie_crabcache_thread_id;
    }
}

server {
    listen 18010 ssl;
    http2 on;
    server_name your-domain.example.com;

    ssl_certificate     /www/sites/your-domain.example.com/ssl/fullchain.pem;
    ssl_certificate_key /www/sites/your-domain.example.com/ssl/privkey.pem;

    client_max_body_size 4m;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_connect_timeout 60s;

    location ^~ / {
        proxy_pass http://127.0.0.1:18001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
}
