# 1Panel OpenResty — 无公网 80/443，使用域名:端口 + HTTPS
# API:  https://v4.wumingaicg.website:18000/v1
# Admin: https://v4.wumingaicg.website:18010
#
# Install certs to /www/sites/v4.wumingaicg.website/ssl/ (fullchain.pem + privkey.pem)
# then include this file from 1Panel site conf or copy to /opt/1panel/www/conf.d/

server {
    listen 18000 ssl;
    http2 on;
    server_name v4.wumingaicg.website;

    ssl_certificate     /www/sites/v4.wumingaicg.website/ssl/fullchain.pem;
    ssl_certificate_key /www/sites/v4.wumingaicg.website/ssl/privkey.pem;

    client_max_body_size 4m;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_connect_timeout 60s;

    location ^~ / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
    }
}

server {
    listen 18010 ssl;
    http2 on;
    server_name v4.wumingaicg.website;

    ssl_certificate     /www/sites/v4.wumingaicg.website/ssl/fullchain.pem;
    ssl_certificate_key /www/sites/v4.wumingaicg.website/ssl/privkey.pem;

    client_max_body_size 4m;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_connect_timeout 60s;

    location ^~ / {
        proxy_pass http://127.0.0.1:18001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
}
