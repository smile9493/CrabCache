[patch.crates-io]
pingora-proxy = { path = "third_party/pingora-proxy" }

[workspace]
resolver = "2"
members = [
    "crates/crab-gateway",
    "crates/crab-proxy",
    "crates/crab-route",
    "crates/crab-cache",
    "crates/crab-semantic",
    "crates/crab-metrics",
    "crates/crab-admin",
    "crates/crab-dashboard",
    "crates/crab-reasoning",
    "crates/crab-pipeline",
    "crates/crab-control",
    "crates/crab-state",
    "crates/crab-composition",
    "crates/crab-admin-types",
    "crates/crab-capture",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/smile9493/CrabCache"

[workspace.dependencies]
# -- Pingora core --
pingora        = { version = "0.8", features = ["proxy", "openssl"] }
pingora-core   = "0.8"
pingora-proxy  = "0.8"
pingora-ketama = "0.8"
pingora-http   = "0.8"

# -- Async runtime --
tokio = { version = "1", features = ["full"] }

# -- Cache --
moka      = { version = "0.12", features = ["future"] }
redis     = { version = "0.27", features = ["tokio-comp", "connection-manager"] }
bb8       = "0.8"
bb8-redis = "0.17"

# -- Semantic cache --
ort            = { version = "2.0.0-rc.12", features = ["load-dynamic"] }
qdrant-client  = "1"
tokenizers     = { version = "0.21", features = ["http"] }

# -- Serialization & config --
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
toml       = "0.8"

# -- Observability --
prometheus = "0.13"
tracing-appender = "0.2"

# -- Utilities --
parking_lot    = "0.12"
bytes          = "1"
anyhow         = "1"
thiserror      = "2"
tracing        = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
dashmap        = "6"
async-trait    = "0.1.83"
uuid           = { version = "1", features = ["v4"] }
sha2           = "0.10"
hex            = "0.4"
http           = "1"
once_cell      = "1"
chrono         = "0.4"

# -- Internal crates --
crab-metrics   = { path = "crates/crab-metrics" }
crab-route     = { path = "crates/crab-route" }
crab-cache     = { path = "crates/crab-cache" }
crab-semantic  = { path = "crates/crab-semantic" }
crab-proxy     = { path = "crates/crab-proxy" }
crab-reasoning = { path = "crates/crab-reasoning" }
crab-pipeline   = { path = "crates/crab-pipeline" }
crab-admin     = { path = "crates/crab-admin" }
crab-control   = { path = "crates/crab-control" }
crab-state      = { path = "crates/crab-state" }
crab-composition = { path = "crates/crab-composition" }
crab-capture    = { path = "crates/crab-capture" }
crab-admin-types = { path = "crates/crab-admin-types" }
rusqlite       = { version = "0.32", features = ["bundled"] }
tokio-postgres = "0.7"
deadpool-postgres = { version = "0.14", features = ["serde"] }
regex          = "1"
unicode-normalization = "0.1"
subtle = "2"
indexmap = { version = "2", features = ["serde"] }

[workspace.lints.clippy]
too_many_arguments = "allow"
redundant_locals = "allow"
type_complexity = "allow"
len_without_is_empty = "allow"
unused_unit = "allow"
field_reassign_with_default = "allow"
result_large_err = "allow"
uninlined_format_args = "allow"
inconsistent_digit_grouping = "allow"
unnecessary_sort_by = "allow"
collapsible_if = "allow"
if_same_then_else = "allow"

[workspace.lints.rust]
dead_code = "allow"
deprecated = "allow"

[profile.release]
lto = true
codegen-units = 4
opt-level = "z"
panic = "abort"
strip = "symbols"
