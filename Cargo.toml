[workspace]
resolver = "2"
members = [
    "crates/crab-gateway",
    "crates/crab-proxy",
    "crates/crab-route",
    "crates/crab-cache",
    "crates/crab-semantic",
    "crates/crab-metrics",
    "crates/crab-admin",
    "crates/crab-dashboard",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/smile9493/CrabCache"

[workspace.dependencies]
# -- Pingora core --
pingora        = { version = "0.8", features = ["proxy"] }
pingora-core   = "0.8"
pingora-proxy  = "0.8"
pingora-ketama = "0.8"
pingora-http   = "0.8"

# -- Async runtime --
tokio = { version = "1", features = ["full"] }

# -- Cache --
moka      = { version = "0.12", features = ["future"] }
redis     = { version = "0.27", features = ["tokio-comp", "connection-manager"] }
bb8       = "0.8"
bb8-redis = "0.17"

# -- Semantic cache --
ort            = { version = "2.0.0-rc.12", features = ["load-dynamic"] }
qdrant-client  = "1"
tokenizers     = { version = "0.21", features = ["http"] }

# -- Serialization & config --
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
toml       = "0.8"

# -- Observability --
prometheus = "0.13"

# -- Utilities --
bytes          = "1"
anyhow         = "1"
thiserror      = "2"
tracing        = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dashmap        = "6"
async-trait    = "0.1.83"
uuid           = { version = "1", features = ["v4"] }
sha2           = "0.10"
hex            = "0.4"
http           = "1"
once_cell      = "1"

# -- Internal crates --
crab-metrics   = { path = "crates/crab-metrics" }
crab-route     = { path = "crates/crab-route" }
crab-cache     = { path = "crates/crab-cache" }
crab-semantic  = { path = "crates/crab-semantic" }
crab-proxy     = { path = "crates/crab-proxy" }
