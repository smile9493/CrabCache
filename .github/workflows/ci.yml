name: CI

on:
  push:
    tags:
      - 'v*'
      - '[0-9]+.[0-9]+.[0-9]+*'
    branches: [main, master]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'LICENSE'
      - 'NOTICE'
      - '.gitignore'
      - '.dockerignore'
      - '.gitattributes'
      - 'assets/**'
      - '**.png'
      - '**.svg'
  pull_request:
    branches: [main, master]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'LICENSE'
      - 'NOTICE'
      - '.gitignore'
      - '.dockerignore'
      - '.gitattributes'
      - 'assets/**'
      - '**.png'
      - '**.svg'

permissions:
  contents: read
  checks: write

env:
  CARGO_TERM_COLOR: always
  CRABCACHE_TEST_REDIS_URL: redis://127.0.0.1:6379
  RUST_BACKTRACE: 1

jobs:
  check:
    name: Lint & Format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake pkg-config libssl-dev clang

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2

      - name: Lint GitHub Actions workflows (actionlint)
        uses: rhysd/actionlint@v1.7.12

      - name: Cargo fmt
        run: cargo fmt --all --check

      - name: Cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --all-features

      - name: Security audit
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ignore: RUSTSEC-2024-0437

  check-wasm:
    name: Check WASM (dashboard)
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Check dashboard compiles to WASM
        run: cargo check -p crab-dashboard --target wasm32-unknown-unknown

  test:
    name: Test (core crates)
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake pkg-config libssl-dev clang

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: |
          cargo test -p crab-control \
            -p crab-cache \
            -p crab-route \
            -p crab-proxy \
            -p crab-gateway \
            -p crab-metrics \
            -p crab-admin \
            -p crab-state \
            -p crab-pipeline \
            -p crab-reasoning \
            -p crab-semantic \
            -p crab-composition \
            -p crab-admin-types \
            -p crab-capture \
            --no-fail-fast

  build-gateway:
    name: Build Gateway (linux-amd64)
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake pkg-config libssl-dev clang

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2

      - name: Build crab-gateway
        run: cargo build --release -p crab-gateway

      - name: Compress binary
        run: tar -cJf crab-gateway-linux-amd64.tar.xz -C target/release crab-gateway

      - name: Upload gateway artifact (branch)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: crab-gateway-${{ github.sha }}
          path: crab-gateway-linux-amd64.tar.xz
          retention-days: 3

      - name: Upload gateway artifact (tag)
        if: github.ref_type == 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: crab-gateway-${{ github.ref_name }}
          path: crab-gateway-linux-amd64.tar.xz
          retention-days: 7

  build-admin:
    name: Build Admin (linux-amd64)
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake pkg-config libssl-dev clang

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Install trunk
        uses: taiki-e/install-action@v2
        with:
          tool: trunk

      - uses: Swatinem/rust-cache@v2

      - name: Build crab-admin
        run: cargo build --release -p crab-admin

      - name: Build dashboard (WASM)
        working-directory: crates/crab-dashboard
        run: trunk build --release

      - name: Compress binary
        run: |
          mkdir -p pkg/crab-admin
          cp target/release/crab-admin pkg/crab-admin/
          cp -r crates/crab-dashboard/dist pkg/crab-admin/dashboard
          tar -cJf crab-admin-linux-amd64.tar.xz -C pkg crab-admin

      - name: Upload admin artifact (branch)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: crab-admin-${{ github.sha }}
          path: crab-admin-linux-amd64.tar.xz
          retention-days: 3

      - name: Upload admin artifact (tag)
        if: github.ref_type == 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: crab-admin-${{ github.ref_name }}
          path: crab-admin-linux-amd64.tar.xz
          retention-days: 7

  docker-gateway:
    name: Docker Image (gateway)
    if: github.ref_type == 'tag'
    needs: [build-gateway]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-buildx-action@v3

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/crabcache-gateway
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push gateway image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

  docker-admin:
    name: Docker Image (admin)
    if: github.ref_type == 'tag'
    needs: [build-admin]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-buildx-action@v3

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/crabcache-admin
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push admin image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.admin
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Create Release
    if: github.ref_type == 'tag'
    needs: [docker-gateway, docker-admin]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download gateway artifact
        uses: actions/download-artifact@v4
        with:
          name: crab-gateway-${{ github.ref_name }}

      - name: Download admin artifact
        uses: actions/download-artifact@v4
        with:
          name: crab-admin-${{ github.ref_name }}

      - name: Generate changelog
        id: changelog
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --tag ${{ github.ref_name }} --strip all
        continue-on-error: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: CrabCache ${{ github.ref_name }}
          body: ${{ steps.changelog.outputs.content || 'No changelog available.' }}
          files: |
            crab-gateway-linux-amd64.tar.xz
            crab-admin-linux-amd64.tar.xz
          draft: false
          prerelease: ${{ contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}