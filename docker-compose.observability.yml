# Optional Prometheus + Grafana for CrabCache gateway metrics.
#
#   docker compose -f docker-compose.yml -f docker-compose.observability.yml --profile observability up -d
#
# Grafana: http://127.0.0.1:3001 (admin / admin — change on first login)
# Prometheus: http://127.0.0.1:9091

services:
  prometheus:
    profiles:
      - observability
    image: prom/prometheus:v2.55.1
    container_name: crabcache-prometheus
    ports:
      - "127.0.0.1:9091:9090"
    volumes:
      - ./config/prometheus/prometheus.example.yml:/etc/prometheus/prometheus.yml:ro
      - ./config/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-lifecycle
    depends_on:
      gateway:
        condition: service_healthy
    restart: unless-stopped

  grafana:
    profiles:
      - observability
    image: grafana/grafana:11.4.0
    container_name: crabcache-grafana
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  grafana_data:
